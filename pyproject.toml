[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "testpilot-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi==0.135.2", "pydantic==2.13.4", "sqlalchemy==2.0.48", "alembic==1.18.4", "psycopg[binary]==3.3.3", "playwright==1.61.0", "uvicorn==0.51.0", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.15.6"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
